[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    smoke: 冒烟测试
    ui: UI 自动化
    api: 接口自动化
    login: 登录相关
    positive: 正向用例（需有效账号）
    negative: 负向用例
    security: 安全测试（SQL注入等）
    session: 会话与状态（接口）
